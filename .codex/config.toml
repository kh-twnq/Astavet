#:schema https://developers.openai.com/codex/config-schema.json
# ECC-inspired project defaults; instructions and skills are repo-scoped.
# Reference: https://learn.chatgpt.com/docs/config-file/config-reference
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
project_doc_max_bytes = 32768
# Use the user's model, connectors and global settings.
# Native skills are discovered from .agents/skills.
# No plugin-only SessionStart hook or automatic global sync is installed.

[features]
multi_agent = true

[agents]
max_concurrent_threads_per_session = 4
max_depth = 1

[agents.explorer]
description = "Read-only exploration and evidence gathering."
config_file = "agents/explorer.toml"

[agents.java_reviewer]
description = "Java and Spring Boot correctness, transaction and compatibility review."
config_file = "agents/java_reviewer.toml"

[agents.java_build_resolver]
description = "Resolve Gradle and Java 21 build or test failures."
config_file = "agents/java_build_resolver.toml"

[agents.security_reviewer]
description = "Review Spring Security, CSRF, authorization and sensitive data handling."
config_file = "agents/security_reviewer.toml"

[agents.harness_optimizer]
description = "Review ECC routing, context efficiency, graph validity and quality gates."
config_file = "agents/harness_optimizer.toml"

# MCP comes from the portable user harness; no duplicate project launcher.
# See docs/ecc/PORTABLE.md for installation on another machine.
