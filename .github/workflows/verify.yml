name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: astavet_test
          POSTGRES_USER: astavet_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U astavet_test" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check bootJar postgresTest
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/astavet_test
          TEST_DATABASE_USERNAME: astavet_test
          TEST_DATABASE_PASSWORD: isolated-ci-only
