name: ECC and backend verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: astavet_integration_test
          POSTGRES_USER: astavet_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astavet_test -d astavet_integration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: ECC integrity and harness checks
        run: |
          bash scripts/verify.sh ecc
          node tools/ecc/scripts/eval-harness.js example
      - name: Java build and tests
        run: bash scripts/verify.sh backend
      - name: PostgreSQL integration tests
        env:
          ASTAVET_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/astavet_integration_test
          ASTAVET_TEST_DATABASE_USERNAME: astavet_test
          ASTAVET_TEST_DATABASE_PASSWORD: test-only-password
        run: bash scripts/verify.sh integration
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
