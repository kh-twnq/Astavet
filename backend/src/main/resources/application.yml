spring:
  application:
    name: astavet-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/astavet}
    username: ${DATABASE_USERNAME:astavet}
    password: ${DATABASE_PASSWORD:astavet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
      timeout: 8h
  error:
    include-message: never

store:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  shipping-fee: ${SHIPPING_FEE:30000}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

