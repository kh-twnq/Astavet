plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.astavet'
version = '0.1.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = '512m'
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs.add('-parameters') }

test { systemProperty 'spring.profiles.active', 'test' }

tasks.register('postgresTest', Test) {
    description = 'Run the integration suite against a dedicated PostgreSQL database'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'spring.profiles.active', 'postgres-test'
    shouldRunAfter test
}

configurations {
    javaFormatter { transitive = false }
}

dependencies {
    javaFormatter 'com.google.googlejavaformat:google-java-format:1.37.0:all-deps'
}

def javaStyleSources = files(sourceSets.collect { it.allJava })
def configureJavaFormatter = { JavaExec task, List<String> options ->
    task.group = 'verification'
    task.classpath = configurations.javaFormatter
    task.mainClass = 'com.google.googlejavaformat.java.Main'
    task.javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    task.jvmArgs = ['api', 'code', 'file', 'parser', 'tree', 'util'].collect {
        "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED"
    }
    task.inputs.files(javaStyleSources)
    task.doFirst {
        task.args = ['--google-style', '--max-line-length=100', '--skip-javadoc-formatting'] + options +
                javaStyleSources.files.sort { it.path }.collect { it.absolutePath }
    }
}

tasks.register('javaFormat', JavaExec) {
    description = 'Apply the project Google Java formatting baseline'
    configureJavaFormatter(delegate, ['--replace'])
}

tasks.register('javaStyleCheck', JavaExec) {
    description = 'Fail if production or test Java source needs formatting'
    configureJavaFormatter(delegate, ['--dry-run', '--set-exit-if-changed'])
}

tasks.named('check') { dependsOn 'javaStyleCheck' }
